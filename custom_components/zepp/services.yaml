sync_history:
  name: Sincronizza cronologia
  description: Importa dallo spazio cloud Zepp i dati storici (passi, calorie e sonno) nel database storico di Home Assistant.
  fields:
    days:
      name: Giorni da sincronizzare
      description: Numero di giorni passati da cui importare lo storico (ad esempio 30, 90, 365 oppure 1825 per 5 anni).
      default: 90
      selector:
        number:
          min: 1
          max: 7300
          unit_of_measurement: giorni
          mode: box
